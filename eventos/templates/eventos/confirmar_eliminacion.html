{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>

<body class="bg-gray-100 text-gray-800 p-8">
    <div class="max-w-xl mx-auto">
        <a href="{% url 'lista_eventos' %}" class="text-indigo-600 hover:text-indigo-800 font-medium">
            ← Volver al listado
        </a>

        <div class="bg-white rounded-xl shadow-md border border-gray-200 p-6 mt-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-4">{{ titulo }}</h1>
            <p class="text-gray-600 mb-6">{{ mensaje }}</p>

            <form method="POST" class="flex gap-3">
                {% csrf_token %}
                <button type="submit"
                    class="bg-red-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-red-700 transition-colors">
                    Sí, eliminar
                </button>
                <a href="{% url 'lista_eventos' %}"
                    class="bg-gray-200 text-gray-800 font-bold py-2 px-6 rounded-lg hover:bg-gray-300 transition-colors">
                    Cancelar
                </a>
            </form>
        </div>
    </div>
</body>

</html>
