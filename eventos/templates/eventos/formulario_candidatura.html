{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>

<body class="bg-gray-100 text-gray-800 p-8">
    <div class="max-w-xl mx-auto">
        <a href="{% url 'lista_eventos' %}" class="text-indigo-600 hover:text-indigo-800 font-medium">
            ← Volver al listado
        </a>

        <div class="bg-white rounded-xl shadow-md border border-gray-200 p-6 mt-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">{{ titulo }}</h1>

            <form method="POST">
                {% csrf_token %}
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    {% for field in form %}
                    <div class="flex flex-col {% if field.name == 'notas' %}md:col-span-2{% endif %}">
                        <label class="text-sm font-bold text-gray-700" for="{{ field.id_for_label }}">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.errors %}
                        <p class="text-red-600 text-sm mt-1">{{ field.errors.0 }}</p>
                        {% endif %}
                    </div>
                    {% endfor %}
                </div>

                <div class="flex gap-3">
                    <button type="submit"
                        class="bg-indigo-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-indigo-700 transition-colors">
                        Guardar cambios
                    </button>
                    <a href="{% url 'lista_eventos' %}"
                        class="bg-gray-200 text-gray-800 font-bold py-2 px-6 rounded-lg hover:bg-gray-300 transition-colors">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
