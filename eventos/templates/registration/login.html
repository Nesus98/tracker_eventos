{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 flex justify-center items-center min-h-screen p-4">

    <div class="bg-white rounded-xl shadow-md border border-gray-200 p-8 w-full max-w-md">
        <h2 class="text-3xl font-extrabold text-indigo-600 text-center mb-2">¡Hola de nuevo! 👋</h2>
        <p class="text-gray-500 text-center mb-6 text-sm">Inicia sesión para gestionar tu panel de eventos</p>

        {% if form.errors %}
            <div class="bg-red-50 text-red-700 p-3 rounded-lg text-sm mb-4 border border-red-100 text-center">
                El usuario o la contraseña no son correctos.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="space-y-4 mb-6">
                {% for field in form %}
                    <div class="flex flex-col">
                        <label class="text-sm font-bold text-gray-700 mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        <input type="{{ field.field.widget.input_type }}" 
                               name="{{ field.html_name }}" 
                               id="{{ field.id_for_label }}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                    </div>
                {% endfor %}
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition-colors shadow-sm">
                Ingresar
            </button>
        </form>
    </div>

</body>
</html>
